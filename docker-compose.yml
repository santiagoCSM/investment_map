services:
  redis:
    image: redis:7-alpine
    container_name: investment-map-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  mongo:
    image: mongo:7
    container_name: investment-map-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: investment_map

volumes:
  redis_data:
  mongo_data:
